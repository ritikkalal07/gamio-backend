services:
  - type: web
    name: gamio-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: HAPIO_API_KEY
        sync: false
      - key: REACT_APP_PAYPAL_CLIENT_ID
        sync: false
      - key: OTP_EXPIRES_MINUTES
        sync: false
      - key: RESEND_OTP_COOLDOWN_SECONDS
        sync: false
